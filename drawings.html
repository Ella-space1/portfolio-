            <figcaption><strong>Untitled</strong><br>After watching <em>Squid Game</em>, I found it strange how desire takes hold of people. The faint figure in the clouds is Sisyphus, who in Greek myth is punished by having to take a boulder up a mountain again and again.</figcaption>

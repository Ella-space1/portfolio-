<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>XENOLOG Publish</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="main-header">
    <div class="header-inner">
      <a href="index.html" class="site-title">XENOLOG👽</a>
      <nav class="nav-menu">
        <a href="community.html">COMMUNITY</a>
        <a href="map.html">MAP</a>
        <a href="publish.html" aria-current="page">PUBLISH</a>
        <a href="news.html">NEWS</a>
      </nav>
    </div>
  </header>
  <main>
<div class="publish">
      <h1>Share your sightings</h1>
      <form id="publish-form">
        <label>Choose a photo
          <input type="file" id="image-input" accept="image/*" required>
        </label>
        <label>Add a caption
          <textarea id="caption-input" placeholder="Describe what you saw" maxlength="300" required></textarea>
        </label>
        <button type="submit">Publish</button>
        <p>Your post is saved only in this browser and is not uploaded.</p>
        <p class="status" id="status" role="status"></p>
      </form>
      <h2>Posts you've shared so far</h2>
      <div class="gallery" id="gallery"></div>
    </div>
  </main>
  <footer class="note">School project by <a href="../xenolog.html">Ella Lee</a>. All numbers, posts, and news on this site are fictional samples.</footer>
  <script src="posts.js"></script>
  <script>
    const gallery = document.getElementById('gallery');
    const form = document.getElementById('publish-form');
    const status = document.getElementById('status');

    function renderGallery() {
      gallery.replaceChildren();
      loadPosts().forEach((p, i) => {
        const el = document.createElement('div');
        el.className = 'post';
        const del = document.createElement('button');
        del.className = 'delete-btn';
        del.textContent = '\u2715';
        del.setAttribute('aria-label', 'Delete post');
        del.onclick = () => { const a = loadPosts(); a.splice(i, 1); savePosts(a); renderGallery(); };
        const img = document.createElement('img');
        img.src = p.url;
        img.alt = p.caption;
        const cap = document.createElement('div');
        cap.className = 'caption';
        cap.textContent = p.caption;
        el.append(del, img, cap);
        gallery.prepend(el);
      });
    }

    // Shrink photos so they fit in browser storage.
    async function shrink(file) {
      const bmp = await createImageBitmap(file);
      const k = Math.min(1, 1000 / Math.max(bmp.width, bmp.height));
      const c = document.createElement('canvas');
      c.width = Math.round(bmp.width * k);
      c.height = Math.round(bmp.height * k);
      const x = c.getContext('2d');
      x.fillStyle = '#fff';
      x.fillRect(0, 0, c.width, c.height);
      x.drawImage(bmp, 0, 0, c.width, c.height);
      return c.toDataURL('image/jpeg', 0.8);
    }

    form.addEventListener('submit', async e => {
      e.preventDefault();
      const caption = document.getElementById('caption-input').value.trim();
      const file = document.getElementById('image-input').files[0];
      if (!file || !caption) { status.textContent = 'Add a photo and a caption.'; return; }
      try {
        const posts = loadPosts();
        posts.push({ url: await shrink(file), caption, ts: Date.now() });
        if (!savePosts(posts)) { status.textContent = 'Browser storage is full. Delete a post and try again.'; return; }
        form.reset();
        status.textContent = 'Published. See it in Community.';
        renderGallery();
      } catch { status.textContent = 'This image could not be read. Try a JPG or PNG.'; }
    });
    renderGallery();
  </script>
</body>
</html>
